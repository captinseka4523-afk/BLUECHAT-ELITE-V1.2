name: Build ZIP Project APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract ZIP and Arrange Project
        run: |
          echo "=== الملفات الموجودة في الجذر حالياً ==="
          ls -la

          # البحث تلقائياً عن أي ملف مضغوط (ZIP) تم رفعه
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "تم العثور على ملف الـ ZIP: $ZIP_FILE"
            mkdir -p unzipped_folder
            unzip -o "$ZIP_FILE" -d unzipped_folder
            
            # الدخول إلى المجلد الداخلي الناتج عن فك الضغط ونقل محتوياته للجذر الرئيسي
            EXTRACTED_SUB=$(find unzipped_folder -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$EXTRACTED_SUB" ]; then
              echo "نقل الملفات من المجلد: $EXTRACTED_SUB إلى الجذر الرئيسي"
              shopt -s dotglob
              mv "$EXTRACTED_SUB"/* .
              shopt -u dotglob
            fi
          else
            echo "تنبيه: لم يتم العثور على ملف ZIP، سيتم اعتماد الملفات الموجودة مباشرة."
          fi

          echo "=== الملفات بعد الترتيب ==="
          ls -la

      - name: Build Debug APK Safely
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueChat-Elite-Full-APK
          path: app/build/outputs/apk/debug/app-debug.apk
