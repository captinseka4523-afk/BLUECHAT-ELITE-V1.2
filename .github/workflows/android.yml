name: Build Uploaded ZIP Project

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Unzip and Setup Project Structure
        run: |
          echo "=== الملفات الموجودة في الجذر حالياً ==="
          ls -la

          # البحث عن ملف الـ ZIP الذي رفعته تلقائياً
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "تم العثور على ملف الـ ZIP: $ZIP_FILE"
            mkdir -p temp_unzipped
            unzip -q "$ZIP_FILE" -d temp_unzipped
            
            # استخراج محتويات المجلد الداخلي للـ ZIP ووضعها في الجذر الرئيسي
            SUB_DIR=$(find temp_unzipped -mindepth 1 -maxdepth 1 -type d | head -n 1)
            
            if [ -n "$SUB_DIR" ]; then
              echo "نقل محتويات المجلد: $SUB_DIR إلى الجذر الرئيسي للمشروع"
              shopt -s dotglob
              cp -r "$SUB_DIR"/* .
              shopt -u dotglob
            else
              shopt -s dotglob
              cp -r temp_unzipped/* .
              shopt -u dotglob
            fi
            
            echo "=== الهيكلة بعد الفك والنقل ==="
            ls -la
          else
            echo "خطأ: لم يتم العثور على ملف ZIP في المستودع!"
            exit 1
          fi

      - name: Build Debug APK Safely
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueChat-Elite-Full-APK
          path: app/build/outputs/apk/debug/app-debug.apk
